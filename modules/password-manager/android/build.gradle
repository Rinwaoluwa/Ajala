plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ajala.app'
version = '1.0.0'

android {
  namespace "expo.modules.passwordmanager"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Credential Manager, and the Play services bridge that routes it to Google Password Manager.
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
}
