name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life in April 2026. React Native 0.86 accepts
          # ^22.13.0, so this tracks the current LTS line.
          node-version: 22
          cache: npm
      - run: npm ci

      # Architecture is a build gate, not a review convention.
      - name: Layer & feature boundaries
        run: npm run check:boundaries

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
